#include <stdio.h>
#include <stdlib.h>
#include <string.h>

struct Node {
    char song[50];
    struct Node *next;
};

struct Node *head = NULL;

void addSong(char *name) {
    struct Node *newNode = (struct Node*)malloc(sizeof(struct Node));
    strcpy(newNode->song, name);
    newNode->next = NULL;
    if (head == NULL) {
        head = newNode;
    } else {
        struct Node *temp = head;
        while (temp->next != NULL)
            temp = temp->next;
        temp->next = newNode;
    }
    printf("Song '%s' added to playlist.\n", name);
}

void removeSong(char *name) {
    struct Node *temp = head, *prev = NULL;
    while (temp != NULL && strcmp(temp->song, name) != 0) {
        prev = temp;
        temp = temp->next;
    }
    if (temp == NULL) {
        printf("Song '%s' not found.\n", name);
        return;
    }
    if (prev == NULL)
        head = temp->next;
    else
        prev->next = temp->next;
    free(temp);
    printf("Song '%s' removed from playlist.\n", name);
}

void moveUp(char *name) {
    struct Node *temp = head, *prev = NULL, *prevprev = NULL;
    while (temp != NULL && strcmp(temp->song, name) != 0) {
        prevprev = prev;
        prev = temp;
        temp = temp->next;
    }
    if (temp == NULL || prev == NULL) {
        printf("Cannot move '%s' up.\n", name);
        return;
    }
    prev->next = temp->next;
    temp->next = prev;
    if (prevprev == NULL)
        head = temp;
    else
        prevprev->next = temp;
    printf("Song '%s' moved up.\n", name);
}

void moveDown(char *name) {
    struct Node *temp = head, *prev = NULL;
    while (temp != NULL && strcmp(temp->song, name) != 0) {
        prev = temp;
        temp = temp->next;
    }
    if (temp == NULL || temp->next == NULL) {
        printf("Cannot move '%s' down.\n", name);
        return;
    }
    struct Node *next = temp->next;
    temp->next = next->next;
    next->next = temp;
    if (prev == NULL)
        head = next;
    else
        prev->next = next;
    printf("Song '%s' moved down.\n", name);
}

void display() {
    struct Node *temp = head;
    printf("Playlist: ");
    if (temp == NULL) {
        printf("(empty)\n");
        return;
    }
    while (temp != NULL) {
        printf("%s", temp->song);
        if (temp->next != NULL) printf(" -> ");
        temp = temp->next;
    }
    printf("\n");
}

int main() {

    addSong("Song B");
    addSong("Song C");
    addSong("Song D");
    display();
    moveUp("Song C");
    display();
    moveDown("Song A");
    display();
    removeSong("Song B");
    display();
    return 0;
}

#include <stdio.h>
#include <string.h>

#define MAX 50

char backStack[MAX][50];
char forwardStack[MAX][50];
int backTop = -1, forwardTop = -1;
char currentPage[50] = "";

void visit(char *page) {
    if (strlen(currentPage) > 0) {
        if (backTop == MAX - 1) {
            printf("Back stack overflow\n");
            return;
        }
        strcpy(backStack[++backTop], currentPage);   /* push current to Back */
    }
    forwardTop = -1;                                  /* clear Forward stack  */
    strcpy(currentPage, page);
    printf("Visited: %s\n", page);
}

void back() {
    if (backTop == -1) {
        printf("No page in Back history.\n");
        return;
    }
    strcpy(forwardStack[++forwardTop], currentPage);  /* push current to Forward */
    strcpy(currentPage, backStack[backTop--]);        /* pop from Back           */
    printf("Current Page: %s\n", currentPage);
}

void forward() {
    if (forwardTop == -1) {
        printf("No page in Forward history.\n");
        return;
    }
    strcpy(backStack[++backTop], currentPage);        /* push current to Back */
    strcpy(currentPage, forwardStack[forwardTop--]);  /* pop from Forward     */
    printf("Current Page: %s\n", currentPage);
}

int main() {
    visit("Google");
    visit("Wikipedia");
    visit("YouTube");
    back();
    back();
    forward();
    return 0;
}

#include <stdio.h>
#define MAX 5

int queue[MAX];
int front = -1, rear = -1;

void enqueue(int token)
{
    if(rear == MAX - 1)
    {
        printf("Queue Overflow\n");
    }
    else
    {
        if(front == -1)
            front = 0;
        rear++;
        queue[rear] = token;
        printf("Customer %d arrived.\n", token);

{
    if(front == -1)

    int i;
    if(front == -1)

        printf("Queue is empty.\n");

    else

        printf("\n");

 original: String.raw`#include <stdio.h>

void shellSort(int arr[], int n)
{
    int gap, i, j, temp;
    for (gap = n / 2; gap > 0; gap = gap / 2)
    {
        for (i = gap; i < n; i++)
        {
            temp = arr[i];
            for (j = i; j >= gap && arr[j - gap] > temp; j -= gap)
            {
                arr[j] = arr[j - gap];
            }
            arr[j] = temp;
        }
    }
}

int main()
{
    int n, i;
    int arr[100];

    printf("Enter the number of elements: ");
    scanf("%d", &n);

    printf("Enter the elements:\n");
    for(i = 0; i < n; i++)
    {
        scanf("%d", &arr[i]);
    }

    shellSort(arr, n);

    printf("Sorted array:\n");
    for(i = 0; i < n; i++)
    {
        printf("%d ", arr[i]);
    }
    return 0;
}

int linearSearch(int arr[], int n, int key)
{
    int i;
    for(i = 0; i < n; i++)
    {
        if(arr[i] == key)
            return i;
    }
    return -1;
}

int binarySearch(int arr[], int n, int key)
{
    int low = 0, high = n - 1, mid;
    while(low <= high)
    {
        mid = (low + high) / 2;
        if(arr[mid] == key)
            return mid;
        else if(key < arr[mid])
            high = mid - 1;
        else
            low = mid + 1;
    }
    return -1;
}

const STATUS = {

const $ = id => document.getElementById(id);
let cur = 0, tab = "original";

function short(t){ return t.length > 70 ? t.slice(0,67) + "…" : t; }

function buildSelect(){
  const sel = $("exp");
  EXPERIMENTS.forEach((e,i)=>{
    const o = document.createElement("option");
    const mark = e.status==="ok" ? "✔" : e.status==="warn" ? "⚠" : "✘";
    o.value = i;
    o.textContent = `${mark}  Exp ${e.id} – ${short(e.title)}`;
    sel.appendChild(o);
  });
  sel.onchange = () => { cur = +sel.value; tab = "original"; render(); };
  $("prev").onclick = () => { if(cur>0){ cur--; sel.value=cur; tab="original"; render(); } };
  $("next").onclick = () => { if(cur<EXPERIMENTS.length-1){ cur++; sel.value=cur; tab="original"; render(); } };
}

function currentText(e){
  if(tab==="original") return e.original;
  if(tab==="fixed") return e.fixed;
  if(tab==="output") return e.output;
  return "";
}

function renderCode(text){
  const pre = document.createElement("pre");
  const lines = text.replace(/\n$/,"").split("\n");
  lines.forEach((l,i)=>{
    const s = document.createElement("span");
    s.className = "ln";
    s.dataset.n = i+1;
    s.textContent = l === "" ? " " : l;
    pre.appendChild(s);
  });
  return pre;
}

function render(){
  const e = EXPERIMENTS[cur];
  const st = STATUS[e.status];

  const info = $("info");
  info.innerHTML = "";
  const h = document.createElement("h2");
  h.textContent = `Experiment ${e.id}: ${e.title}`;
  const b = document.createElement("span");
  b.className = "badge " + st.cls;
  b.textContent = st.text;
  h.appendChild(b);
  const ul = document.createElement("ul");
  e.notes.forEach(n=>{ const li=document.createElement("li"); li.textContent=n; ul.appendChild(li); });
  info.append(h, ul);

  const tabs = $("tabs");
  tabs.innerHTML = "";
  const defs = [["original", e.fixed ? (e.status==="bad" ? "Code in PDF (wrong)" : "Code in PDF") : "Code in PDF"]];
  if(e.fixed) defs.push(["fixed","Corrected code"]);
  defs.push(["output","Output in PDF"], ["pdf","View PDF page"]);
  defs.forEach(([k,label])=>{
    const t = document.createElement("button");
    t.textContent = label;
    if(k===tab) t.classList.add("active");
    t.onclick = ()=>{ tab=k; render(); };
    tabs.appendChild(t);

  const view = $("view");
