<script>
const E=[{"n": 1, "t": "Music playlist using linked list", "c": "/* Program 1: Music Playlist using Linked List (Add, Remove, Move Up/Down) */\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nstruct Node {\n    char song[50];\n    struct Node *next;\n};\n\nstruct Node *head = NULL;\n\nvoid addSong(char *name) {\n    struct Node *newNode = (struct Node*)malloc(sizeof(struct Node));\n    strcpy(newNode->song, name);\n    newNode->next = NULL;\n    if (head == NULL) {\n        head = newNode;\n    } else {\n        struct Node *temp = head;\n        while (temp->next != NULL)\n            temp = temp->next;\n        temp->next = newNode;\n    }\n    printf(\"Song '%s' added to playlist.\\n\", name);\n}\n\nvoid removeSong(char *name) {\n    struct Node *temp = head, *prev = NULL;\n    while (temp != NULL && strcmp(temp->song, name) != 0) {\n        prev = temp;\n        temp = temp->next;\n    }\n    if (temp == NULL) {\n        printf(\"Song '%s' not found.\\n\", name);\n        return;\n    }\n    if (prev == NULL)\n        head = temp->next;\n    else\n        prev->next = temp->next;\n    free(temp);\n    printf(\"Song '%s' removed from playlist.\\n\", name);\n}\n\nvoid moveUp(char *name) {\n    struct Node *temp = head, *prev = NULL, *prevprev = NULL;\n    while (temp != NULL && strcmp(temp->song, name) != 0) {\n        prevprev = prev;\n        prev = temp;\n        temp = temp->next;\n    }\n    if (temp == NULL || prev == NULL) {\n        printf(\"Cannot move '%s' up.\\n\", name);\n        return;\n    }\n    prev->next = temp->next;\n    temp->next = prev;\n    if (prevprev == NULL)\n        head = temp;\n    else\n        prevprev->next = temp;\n    printf(\"Song '%s' moved up.\\n\", name);\n}\n\nvoid moveDown(char *name) {\n    struct Node *temp = head, *prev = NULL;\n    while (temp != NULL && strcmp(temp->song, name) != 0) {\n        prev = temp;\n        temp = temp->next;\n    }\n    if (temp == NULL || temp->next == NULL) {\n        printf(\"Cannot move '%s' down.\\n\", name);\n        return;\n    }\n    struct Node *next = temp->next;\n    temp->next = next->next;\n    next->next = temp;\n    if (prev == NULL)\n        head = next;\n    else\n        prev->next = next;\n    printf(\"Song '%s' moved down.\\n\", name);\n}\n\nvoid display() {\n    struct Node *temp = head;\n    printf(\"Playlist: \");\n    if (temp == NULL) {\n        printf(\"(empty)\\n\");\n        return;\n    }\n    while (temp != NULL) {\n        printf(\"%s\", temp->song);\n        if (temp->next != NULL) printf(\" -> \");\n        temp = temp->next;\n    }\n    printf(\"\\n\");\n}\n\nint main() {\n    addSong(\"Song A\");\n    addSong(\"Song B\");\n    addSong(\"Song C\");\n    addSong(\"Song D\");\n    display();\n    moveUp(\"Song C\");\n    display();\n    moveDown(\"Song A\");\n    display();\n    removeSong(\"Song B\");\n    display();\n    return 0;\n}\n"}, {"n": 2, "t": "Browser Back/Forward using stacks", "c": "/* Program 2: Browser Back and Forward using two stacks */\n#include <stdio.h>\n#include <string.h>\n\n#define MAX 50\n\nchar backStack[MAX][50];\nchar forwardStack[MAX][50];\nint backTop = -1, forwardTop = -1;\nchar currentPage[50] = \"\";\n\nvoid visit(char *page) {\n    if (strlen(currentPage) > 0) {\n        if (backTop == MAX - 1) {\n            printf(\"Back stack overflow\\n\");\n            return;\n        }\n        strcpy(backStack[++backTop], currentPage);   /* push current to Back */\n    }\n    forwardTop = -1;                                  /* clear Forward stack  */\n    strcpy(currentPage, page);\n    printf(\"Visited: %s\\n\", page);\n}\n\nvoid back() {\n    if (backTop == -1) {\n        printf(\"No page in Back history.\\n\");\n        return;\n    }\n    strcpy(forwardStack[++forwardTop], currentPage);  /* push current to Forward */\n    strcpy(currentPage, backStack[backTop--]);        /* pop from Back           */\n    printf(\"Current Page: %s\\n\", currentPage);\n}\n\nvoid forward() {\n    if (forwardTop == -1) {\n        printf(\"No page in Forward history.\\n\");\n        return;\n    }\n    strcpy(backStack[++backTop], currentPage);        /* push current to Back */\n    strcpy(currentPage, forwardStack[forwardTop--]);  /* pop from Forward     */\n    printf(\"Current Page: %s\\n\", currentPage);\n}\n\nint main() {\n    visit(\"Google\");\n    visit(\"Wikipedia\");\n    visit(\"YouTube\");\n    back();\n    back();\n    forward();\n    return 0;\n}\n"}, {"n": 3, "t": "Bank counter queue simulation", "c": "/* Program 3: Simulate Customers Arriving and Being Served at a Bank Counter using Queue */\n#include <stdio.h>\n#define MAX 5\n\nint queue[MAX];\nint front = -1, rear = -1;\n\nvoid enqueue(int token)\n{\n    if(rear == MAX - 1)\n    {\n        printf(\"Queue Overflow\\n\");\n    }\n    else\n    {\n        if(front == -1)\n            front = 0;\n        rear++;\n        queue[rear] = token;\n        printf(\"Customer %d arrived.\\n\", token);\n    }\n}\n\nvoid dequeue()\n{\n    if(front == -1)\n    {\n        printf(\"No customers to serve.\\n\");\n    }\n    else\n    {\n        printf(\"Customer %d served.\\n\", queue[front]);\n        if(front == rear)\n            front = rear = -1;\n        else\n            front++;\n    }\n}\n\nvoid display()\n{\n    int i;\n    if(front == -1)\n    {\n        printf(\"Queue is empty.\\n\");\n    }\n    else\n    {\n        printf(\"Customers waiting: \");\n        for(i = front; i <= rear; i++)\n            printf(\"%d \", queue[i]);\n        printf(\"\\n\");\n    }\n}\n\nint main()\n{\n    int choice, token;\n    do\n    {\n        printf(\"\\n--- Bank Queue Simulation ---\\n\");\n        printf(\"1. Customer Arrival\\n\");\n        printf(\"2. Serve Customer\\n\");\n        printf(\"3. Display Queue\\n\");\n        printf(\"4. Exit\\n\");\n        printf(\"Enter your choice: \");\n        scanf(\"%d\",&choice);\n        switch(choice)\n        {\n            case 1:\n                printf(\"Enter Customer Token: \");\n                scanf(\"%d\",&token);\n                enqueue(token);\n                break;\n            case 2:\n                dequeue();\n                break;\n            case 3:\n                display();\n                break;\n            case 4:\n                printf(\"Exiting...\\n\");\n                break;\n            default:\n                printf(\"Invalid Choice!\\n\");\n        }\n    }\n    while (choice != 4);\n    return 0;\n}\n"}, {"n": 4, "t": "Bubble sort and Insertion sort", "c": "#include <stdio.h>\n\nvoid bubbleSort(int arr[], int n)\n{\n    int i, j, temp;\n    for(i = 0; i < n - 1; i++)\n    {\n        for(j = 0; j < n - i - 1; j++)\n        {\n            if(arr[j] > arr[j + 1])\n            {\n                temp = arr[j];\n                arr[j] = arr[j + 1];\n                arr[j + 1] = temp;\n            }\n        }\n    }\n}\n\nvoid insertionSort(int arr[], int n)\n{\n    int i, key, j;\n    for(i = 1; i < n; i++)\n    {\n        key = arr[i];\n        j = i - 1;\n        while(j >= 0 && arr[j] > key)\n        {\n            arr[j + 1] = arr[j];\n            j--;\n        }\n        arr[j + 1] = key;\n    }\n}\n\nvoid display(int arr[], int n)\n{\n    int i;\n    for(i = 0; i < n; i++)\n        printf(\"%d \", arr[i]);\n    printf(\"\\n\");\n}\n\nint main()\n{\n    int n, i, choice;\n    int arr[100];\n\n    printf(\"Enter number of elements: \");\n    scanf(\"%d\",&n);\n\n    printf(\"Enter array elements:\\n\");\n    for(i = 0; i < n; i++)\n        scanf(\"%d\",&arr[i]);\n\n    printf(\"\\nChoose Sorting Method\\n\");\n    printf(\"1. Bubble Sort\\n\");\n    printf(\"2. Insertion Sort\\n\");\n    printf(\"Enter your choice: \");\n    scanf(\"%d\",&choice);\n\n    switch(choice)\n    {\n        case 1:\n            bubbleSort(arr, n);\n            printf(\"Sorted array using Bubble Sort:\\n\");\n            display(arr, n);\n            break;\n        case 2:\n            insertionSort(arr, n);\n            printf(\"Sorted array using Insertion Sort:\\n\");\n            display(arr, n);\n            break;\n        default:\n            printf(\"Invalid Choice\");\n    }\n    return 0;\n}\n"}, {"n": 5, "t": "Shell sort", "c": "#include <stdio.h>\n\nvoid shellSort(int arr[], int n)\n{\n    int gap, i, j, temp;\n    for (gap = n / 2; gap > 0; gap = gap / 2)\n    {\n        for (i = gap; i < n; i++)\n        {\n            temp = arr[i];\n            for (j = i; j >= gap && arr[j - gap] > temp; j -= gap)\n            {\n                arr[j] = arr[j - gap];\n            }\n            arr[j] = temp;\n        }\n    }\n}\n\nint main()\n{\n    int n, i;\n    int arr[100];\n\n    printf(\"Enter the number of elements: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter the elements:\\n\");\n    for(i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &arr[i]);\n    }\n\n    shellSort(arr, n);\n\n    printf(\"Sorted array:\\n\");\n    for(i = 0; i < n; i++)\n    {\n        printf(\"%d \", arr[i]);\n    }\n    return 0;\n}\n"}, {"n": 6, "t": "Linear search and Binary search", "c": "#include <stdio.h>\n\nint linearSearch(int arr[], int n, int key)\n{\n    int i;\n    for(i = 0; i < n; i++)\n    {\n        if(arr[i] == key)\n            return i;\n    }\n    return -1;\n}\n\nint binarySearch(int arr[], int n, int key)\n{\n    int low = 0, high = n - 1, mid;\n    while(low <= high)\n    {\n        mid = (low + high) / 2;\n        if(arr[mid] == key)\n            return mid;\n        else if(key < arr[mid])\n            high = mid - 1;\n        else\n            low = mid + 1;\n    }\n    return -1;\n}\n\nint main()\n{\n    int arr[100], n, i, key, choice, pos;\n\n    printf(\"Enter the number of elements: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter the elements:\\n\");\n    for(i = 0; i < n; i++)\n        scanf(\"%d\", &arr[i]);\n\n    printf(\"Enter the element to search: \");\n    scanf(\"%d\", &key);\n\n    printf(\"\\n1. Linear Search\\n\");\n    printf(\"2. Binary Search\\n\");\n    printf(\"Enter your choice: \");\n    scanf(\"%d\", &choice);\n\n    if(choice == 1)\n    {\n        pos = linearSearch(arr, n, key);\n    }\n    else if(choice == 2)\n    {\n        pos = binarySearch(arr, n, key);\n    }\n    else\n    {\n        printf(\"Invalid Choice\");\n        return 0;\n    }\n\n    if(pos != -1)\n        printf(\"Element found at position %d\", pos + 1);\n    else\n        printf(\"Element not found\");\n\n    return 0;\n}\n"}, {"n": 7, "t": "Hash table to store/search books", "c": "#include <stdio.h>\n#include <string.h>\n\n#define SIZE 10\n\nstruct Book {\n    int isbn;\n    char title[50];\n    int occupied;\n};\n\nstruct Book hashTable[SIZE];\nint count = 0;\n\n/* Hash function on ISBN */\nint hashFunction(int isbn) {\n    return isbn % SIZE;\n}\n\n/* Find slot of an ISBN, -1 if absent */\nint findIsbn(int isbn) {\n    int index = hashFunction(isbn), i;\n    for (i = 0; i < SIZE; i++) {\n        if (!hashTable[index].occupied)\n            return -1;\n        if (hashTable[index].isbn == isbn)\n            return index;\n        index = (index + 1) % SIZE;\n    }\n    return -1;\n}\n\nvoid insertBook(int isbn, char title[]) {\n    int index;\n    if (count == SIZE) {\n        printf(\"Hash table is full.\\n\");\n        return;\n    }\n    if (findIsbn(isbn) != -1) {\n        printf(\"A book with this ISBN already exists.\\n\");\n        return;\n    }\n    index = hashFunction(isbn);\n    while (hashTable[index].occupied == 1)\n        index = (index + 1) % SIZE;          /* Linear probing */\n\n    hashTable[index].isbn = isbn;\n    strcpy(hashTable[index].title, title);\n    hashTable[index].occupied = 1;\n    count++;\n    printf(\"Book inserted successfully.\\n\");\n}\n\nvoid searchByIsbn(int isbn) {\n    int index = findIsbn(isbn);\n    if (index == -1) {\n        printf(\"\\nBook not found.\\n\");\n        return;\n    }\n    printf(\"\\nBook Found!\\n\");\n    printf(\"ISBN : %d\\n\", hashTable[index].isbn);\n    printf(\"Title: %s\\n\", hashTable[index].title);\n}\n\n/* Title is not the hash key, so scan the table */\nvoid searchByTitle(char title[]) {\n    int i;\n    for (i = 0; i < SIZE; i++) {\n        if (hashTable[i].occupied && strcmp(hashTable[i].title, title) == 0) {\n            printf(\"\\nBook Found!\\n\");\n            printf(\"ISBN : %d\\n\", hashTable[i].isbn);\n            printf(\"Title: %s\\n\", hashTable[i].title);\n            return;\n        }\n    }\n    printf(\"\\nBook not found.\\n\");\n}\n\nvoid display() {\n    int i;\n    printf(\"\\nHash Table\\n\");\n    printf(\"------------------------------\\n\");\n    for (i = 0; i < SIZE; i++) {\n        if (hashTable[i].occupied)\n            printf(\"%d --> ISBN:%d  Title:%s\\n\", i,\n                   hashTable[i].isbn, hashTable[i].title);\n        else\n            printf(\"%d --> Empty\\n\", i);\n    }\n}\n\nint main() {\n    int choice, isbn;\n    char title[50];\n\n    while (1) {\n        printf(\"\\n------ HASH TABLE MENU ------\\n\");\n        printf(\"1. Insert Book\\n\");\n        printf(\"2. Search Book by ISBN\\n\");\n        printf(\"3. Search Book by Title\\n\");\n        printf(\"4. Display\\n\");\n        printf(\"5. Exit\\n\");\n        printf(\"Enter choice: \");\n        if (scanf(\"%d\", &choice) != 1)\n            return 0;\n\n        switch (choice) {\n            case 1:\n                printf(\"Enter ISBN: \");\n                scanf(\"%d\", &isbn);\n                printf(\"Enter Book Title: \");\n                scanf(\" %49[^\\n]\", title);\n                insertBook(isbn, title);\n                break;\n            case 2:\n                printf(\"Enter ISBN to search: \");\n                scanf(\"%d\", &isbn);\n                searchByIsbn(isbn);\n                break;\n            case 3:\n                printf(\"Enter Title to search: \");\n                scanf(\" %49[^\\n]\", title);\n                searchByTitle(title);\n                break;\n            case 4:\n                display();\n                break;\n            case 5:\n                return 0;\n            default:\n                printf(\"Invalid choice!\\n\");\n        }\n    }\n}\n"}, {"n": 8, "t": "File system as a tree", "c": "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct Node\n{\n    char name[50];\n    struct Node *child;\n    struct Node *sibling;\n} Node;\n\nNode *createNode(char name[])\n{\n    Node *newNode = (Node *)malloc(sizeof(Node));\n    strcpy(newNode->name, name);\n    newNode->child = NULL;\n    newNode->sibling = NULL;\n    return newNode;\n}\n\nNode *search(Node *root, char name[])\n{\n    Node *temp;\n    if (root == NULL)\n        return NULL;\n    if (strcmp(root->name, name) == 0)\n        return root;\n    temp = search(root->child, name);\n    if (temp != NULL)\n        return temp;\n    return search(root->sibling, name);\n}\n\nvoid insert(Node *root)\n{\n    char parentName[50], childName[50];\n    Node *parent, *temp, *newNode;\n\n    printf(\"Enter Parent Folder: \");\n    scanf(\"%49s\", parentName);\n    printf(\"Enter New File/Folder: \");\n    scanf(\"%49s\", childName);\n\n    parent = search(root, parentName);\n    if (parent == NULL)\n    {\n        printf(\"Parent Folder Not Found!\\n\");\n        return;\n    }\n    newNode = createNode(childName);\n    if (parent->child == NULL)\n        parent->child = newNode;\n    else\n    {\n        temp = parent->child;\n        while (temp->sibling != NULL)\n            temp = temp->sibling;\n        temp->sibling = newNode;\n    }\n    printf(\"Inserted Successfully.\\n\");\n}\n\n/* Deletes a leaf node at any depth.\n   Returns 1 if the name was found (deleted or refused), 0 otherwise. */\nint deleteNode(Node *parent, char name[])\n{\n    Node *temp = parent->child, *prev = NULL;\n\n    while (temp != NULL)\n    {\n        if (strcmp(temp->name, name) == 0)\n        {\n            if (temp->child != NULL)\n            {\n                printf(\"Folder is not empty. Delete its contents first.\\n\");\n                return 1;\n            }\n            if (prev == NULL)\n                parent->child = temp->sibling;\n            else\n                prev->sibling = temp->sibling;\n            free(temp);\n            printf(\"Deleted Successfully.\\n\");\n            return 1;\n        }\n        if (deleteNode(temp, name))      /* look inside this folder */\n            return 1;\n        prev = temp;\n        temp = temp->sibling;\n    }\n    return 0;\n}\n\nvoid preorder(Node *root, int level)\n{\n    int i;\n    if (root == NULL)\n        return;\n    for (i = 0; i < level; i++)\n        printf(\"   \");\n    printf(\"|-- %s\\n\", root->name);\n    preorder(root->child, level + 1);\n    preorder(root->sibling, level);\n}\n\nint main()\n{\n    Node *root = createNode(\"Root\");\n    int choice;\n    char name[50];\n\n    while (1)\n    {\n        printf(\"\\n===== FILE SYSTEM MENU =====\\n\");\n        printf(\"1. Insert Folder/File\\n\");\n        printf(\"2. Delete File/Folder (Leaf Only)\\n\");\n        printf(\"3. Display File System\\n\");\n        printf(\"4. Exit\\n\");\n        printf(\"Enter your choice: \");\n        if (scanf(\"%d\", &choice) != 1)\n            return 0;\n\n        switch (choice)\n        {\n            case 1:\n                insert(root);\n                break;\n            case 2:\n                printf(\"Enter File/Folder Name to Delete: \");\n                scanf(\"%49s\", name);\n                if (strcmp(name, \"Root\") == 0)\n                    printf(\"Root cannot be deleted.\\n\");\n                else if (!deleteNode(root, name))\n                    printf(\"Node Not Found.\\n\");\n                break;\n            case 3:\n                printf(\"\\nFile System Structure:\\n\");\n                preorder(root, 0);\n                break;\n            case 4:\n                printf(\"Exiting...\\n\");\n                exit(0);\n            default:\n                printf(\"Invalid Choice!\\n\");\n        }\n    }\n    return 0;\n}\n"}, {"n": 9, "t": "Dijkstra's shortest path", "c": "#include <stdio.h>\n\n#define V 5\n#define INF 9999\n\nint minDistance(int dist[], int visited[]) {\n    int min = INF, minIndex = -1, v;\n    for (v = 0; v < V; v++) {\n        if (!visited[v] && dist[v] <= min) {\n            min = dist[v];\n            minIndex = v;\n        }\n    }\n    return minIndex;\n}\n\nvoid dijkstra(int graph[V][V], int src) {\n    int dist[V];\n    int visited[V];\n    int i, count, u, v;\n\n    for (i = 0; i < V; i++) {\n        dist[i] = INF;\n        visited[i] = 0;\n    }\n    dist[src] = 0;\n\n    for (count = 0; count < V - 1; count++) {\n        u = minDistance(dist, visited);\n        visited[u] = 1;\n        for (v = 0; v < V; v++) {\n            if (!visited[v] && graph[u][v] && dist[u] != INF &&\n                dist[u] + graph[u][v] < dist[v]) {\n                dist[v] = dist[u] + graph[u][v];\n            }\n        }\n    }\n\n    printf(\"City\\tDistance from Source (City %d)\\n\", src);\n    for (i = 0; i < V; i++)\n        printf(\"%d\\t%d\\n\", i, dist[i]);\n}\n\nint main() {\n    /* Cities 0-4 connected by roads with distances (0 = no road) */\n    int graph[V][V] = {\n        {0, 4, 0, 0, 8},\n        {4, 0, 8, 0, 0},\n        {0, 8, 0, 7, 0},\n        {0, 0, 7, 0, 9},\n        {8, 0, 0, 9, 0}\n    };\n    dijkstra(graph, 0);\n    return 0;\n}\n"}, {"n": 10, "t": "Prim's minimum spanning tree", "c": "#include <stdio.h>\n\n#define V 5\n#define INF 9999\n\nint minKey(int key[], int mstSet[]) {\n    int min = INF, minIndex = -1, v;\n    for (v = 0; v < V; v++) {\n        if (!mstSet[v] && key[v] < min) {\n            min = key[v];\n            minIndex = v;\n        }\n    }\n    return minIndex;\n}\n\nvoid primMST(int graph[V][V]) {\n    int parent[V];\n    int key[V];\n    int mstSet[V];\n    int i, count, u, v;\n\n    for (i = 0; i < V; i++) {\n        key[i] = INF;\n        mstSet[i] = 0;\n    }\n    key[0] = 0;\n    parent[0] = -1;\n\n    for (count = 0; count < V - 1; count++) {\n        u = minKey(key, mstSet);\n        mstSet[u] = 1;\n        for (v = 0; v < V; v++) {\n            if (graph[u][v] && !mstSet[v] && graph[u][v] < key[v]) {\n                parent[v] = u;\n                key[v] = graph[u][v];\n            }\n        }\n    }\n\n    int totalWeight = 0;\n    printf(\"Edge\\tWeight\\n\");\n    for (i = 1; i < V; i++) {\n        printf(\"%d - %d\\t%d\\n\", parent[i], i, graph[i][parent[i]]);\n        totalWeight += graph[i][parent[i]];\n    }\n    printf(\"Total weight of MST = %d\\n\", totalWeight);\n}\n\nint main() {\n    int graph[V][V] = {\n        {0, 2, 0, 6, 0},\n        {2, 0, 3, 8, 5},\n        {0, 3, 0, 0, 7},\n        {6, 8, 0, 0, 9},\n        {0, 5, 7, 9, 0}\n    };\n    primMST(graph);\n    return 0;\n}\n"}];
